<style>
:root{--bg:#0e0f23;--bg2:#161835;--card:#1c1e42;--line:#2d3066;--tx:#ecebff;--mu:#9b9ec9;--h:265;--ac:hsl(var(--h) 90% 75%);--ac2:hsl(calc(var(--h) + 40) 90% 73%)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:radial-gradient(900px 500px at 85% -10%,hsl(var(--h) 70% 25% / .55),transparent),var(--bg);color:var(--tx);font:16px/1.6 Figtree,system-ui,sans-serif;min-height:100vh;display:flex}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque',Impact,sans-serif;line-height:1.1}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}

aside{width:290px;flex:none;background:var(--bg2);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}
aside .brand{font:800 20px 'Bricolage Grotesque',sans-serif;padding:0 10px 14px}
nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;text-decoration:none;color:var(--mu);font-size:14px;margin-bottom:2px;border-left:3px solid transparent}
nav a:hover{background:#ffffff0d;color:var(--tx)}
nav a.on{background:hsl(var(--c) 60% 40% / .25);color:var(--tx);border-left-color:hsl(var(--c) 90% 65%)}
nav .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 12px Figtree;background:hsl(var(--c) 80% 60% / .2);color:hsl(var(--c) 90% 75%);flex:none}
nav a.done .n{background:hsl(var(--c) 85% 60%);color:#111}
nav .sep{margin:12px 10px 6px;font-size:12px;color:var(--mu);letter-spacing:.04em}
main{flex:1;min-width:0;padding:40px clamp(18px,5vw,64px) 80px;max-width:980px}
.top{display:none}
.hero{display:flex;gap:32px;align-items:center;flex-wrap:wrap;margin-bottom:34px}
.hero h1{font-size:clamp(34px,6vw,60px);font-weight:800;background:linear-gradient(100deg,#ff8ad8,#9d7bff 45%,#4fd1ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mu);max-width:52ch;margin-top:12px}
.ring{--p:0;width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),#ffffff14 0);display:grid;place-items:center;flex:none}
.ring b{width:104px;height:104px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:800 28px 'Bricolage Grotesque'}
.btn{display:inline-block;border:0;border-radius:999px;padding:10px 22px;font-weight:700;background:linear-gradient(100deg,var(--ac),var(--ac2));color:#14122e;text-decoration:none;margin-top:18px}
.btn.g{background:#ffffff14;color:var(--tx);padding:7px 14px;margin:0;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-decoration:none;display:block;position:relative;overflow:hidden}
.tile:hover{border-color:hsl(var(--c) 90% 65%)}
.tile:before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:hsl(var(--c) 90% 65%)}
.tile small{color:hsl(var(--c) 90% 75%);font-weight:700}
.tile h3{font-size:18px;margin:4px 0 10px}
.bar{height:6px;border-radius:9px;background:#ffffff14;overflow:hidden}
.bar i{display:block;height:100%;background:hsl(var(--c) 90% 65%);border-radius:9px}
.wh{border-radius:26px;padding:28px;background:linear-gradient(135deg,hsl(var(--h) 60% 30% / .8),hsl(calc(var(--h) + 50) 60% 22% / .8));border:1px solid hsl(var(--h) 60% 45% / .6);margin-bottom:22px}
.wh .big{font:800 clamp(60px,12vw,110px)/.9 'Bricolage Grotesque';color:var(--ac);opacity:.9}
.wh h2{font-size:clamp(26px,4vw,38px);margin:8px 0}
.wh p{color:#d6d4ff}
.tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--bg2);padding:5px;border-radius:999px;width:fit-content;max-width:100%;overflow:auto}
.tabs button{border:0;background:none;border-radius:999px;padding:8px 18px;font-weight:700;color:var(--mu);white-space:nowrap}
.tabs button.on{background:var(--ac);color:#14122e}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
.card h3{font-size:19px;margin-bottom:10px;color:var(--ac)}
.card li{margin:0 0 9px 20px;padding-left:4px}
.card li::marker{color:var(--ac2)}
.card ul b{color:var(--tx)}
.ex{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.ex:first-of-type{border:0}
.ex input{appearance:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--mu);flex:none;margin-top:2px;cursor:pointer;display:grid;place-items:center}
.ex input:checked{background:var(--ac);border-color:var(--ac)}
.ex input:checked:after{content:"✓";color:#14122e;font-weight:800;font-size:14px}
.ex input:checked+span{color:var(--mu);text-decoration:line-through}
.chk{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:14px}
.chk input[type=number]{width:90px;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:9px 12px;font:700 18px Figtree}
.tag{border-radius:999px;padding:5px 14px;font-weight:700;font-size:14px;background:#ffffff14}
.tag.ok{background:#37d39a33;color:#6ff0c0}.tag.no{background:#ff6b8133;color:#ff9fb0}
.nx{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{overflow-wrap:anywhere;padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--ac)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;white-space:pre-wrap;font:13.5px/1.55 ui-monospace,Menlo,Consolas,monospace;color:#cfe;margin:10px 0}
.sc{overflow-x:auto}

.skip{position:absolute;left:-999px;top:0}.skip:focus{left:8px;top:8px;background:var(--ac);color:#14122e;padding:8px 14px;z-index:30;border-radius:8px;font-weight:700}main:focus{outline:none}@media(max-width:700px){figure.dg{overflow-x:auto}figure.dg svg{min-width:580px}}
@media(max-width:860px){body{display:block}aside{position:fixed;z-index:9;left:0;transform:translateX(-100%);transition:transform .25s}aside.open{transform:none}.top{display:flex;position:sticky;top:0;z-index:5;background:var(--bg2);padding:10px 16px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.top button{background:#ffffff14;border:0;border-radius:10px;padding:6px 12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

["Foundations","Explain what AI, ML and generative AI are, and what they are not.",["Tell AI, machine learning, deep learning and generative AI apart","Match a task to the right tool category","Name the core limits of current systems"],["Hierarchy: AI is the field; ML learns patterns from data; deep learning uses multi-layer neural nets; generative AI creates new content.","Narrow AI: every tool you use is narrow, even when it feels general.","Tool types: chat assistants, image generators, code assistants, search assistants, transcription, automation platforms.","Strong at: summarizing, rewriting, brainstorming, pattern matching.","Weak at: guaranteed facts, exact arithmetic, fresh news, your private context."],["Write a 20-term glossary in your own words (AI, token, context window, RAG, temperature...)","Map 10 weekly tasks to a tool type and an error-risk level","Judge four myths: AI understands, is always current, is unbiased, longer prompts win","Send one prompt to two assistants and compare tone, structure and accuracy"],"10 multiple-choice questions on terms. Then explain to a friend why fluent AI can still be wrong.","Google AI Essentials modules 1-2 (intro to AI, productivity); Elements of AI chapter 1 (What is AI?) and chapter 4 (Machine learning). Note: Elements of AI predates generative AI and does not cover prompting."],
["How LLMs Work","Predict model behavior from tokens, context and sampling.",["Explain tokens, embeddings, attention and next-token prediction","Predict the effect of context limits","Explain what temperature changes"],["Tokens: models read chunks of text, roughly 3-4 English characters each. Code and non-English text cost more.","Next-token prediction: fluent text comes from sampling probabilities, not proof of reasoning.","Context window: prompt + conversation + output must fit. Details in the middle of long inputs can get lost.","Sampling: temperature and top-p trade consistency for variety.","Training: pretraining, instruction tuning, then preference tuning.","Stateless: no memory between chats unless the product adds it. Knowledge stops at a cutoff date."],["Estimate tokens for five texts, then check with a tokenizer","Run one creative prompt five times at low and high temperature","Hide a fact at the start, middle and end of a long document and test recall","Technical: call an API and print token usage from the response"],"12 questions on tokens, context and sampling. Give three causes for different answers to the same question.","DeepLearning.AI Generative AI for Everyone (3 modules, no coding; reported at roughly 3 to 6 hours); Google Cloud Introduction to Large Language Models (about 1 hour)"],
["Prompting Fundamentals","Write structured prompts with a repeatable framework.",["Specify task, context, format and constraints","Separate instructions from data with delimiters","Control tone, length and audience"],["A prompt is a specification: vague in, average out.","TCFO: Task (the action), Context (audience and situation), Format (shape and length), Output constraints (include, avoid, tone).","Delimiters: wrap pasted data in tags or triple quotes so it is not mistaken for instructions.","Say what to do, not only what to avoid. State what a good answer looks like.","Let the model ask up to three clarifying questions when the request is thin.","Treat answer one as a draft and refine.","TCREI: Google's version of the same idea adds References (examples) and a loop: Task, Context, References, Evaluate, Iterate. Practice both."],["Rewrite five weak prompts (\"Help me with my resume\", \"Explain taxes\"...) using TCFO","Summarize a review that contains \"ignore previous instructions\" and fix the prompt","Explain inflation to a 10-year-old, a student and an expert; compare","Start your Prompt Journal with 10 scored prompts"],"Turn three vague requests into full prompts, scored on the rubric in Toolkit. Plus 8 quiz questions.","Google Prompting Essentials (TCREI framework); DeepLearning.AI ChatGPT Prompt Engineering for Developers (9 short lessons, about 1.5 hours, uses Python and the OpenAI API, so it is developer-focused; see the Guidelines lesson)"],
["Intermediate Techniques","Use few-shot, role and step-by-step methods, and build templates.",["Choose zero-, one- or few-shot","Use role prompts for style and framing","Make reusable templates with variables"],["Few-shot: 2-5 diverse, correct, consistent examples teach format and logic. Bad examples teach bad behavior.","Role: \"You are an editor\" shifts style and focus more than facts.","Chain-of-thought: step-by-step reasoning helps multi-step logic and math.","Decomposition: split big tasks into small ones.","Self-check: useful, but not a substitute for outside verification.","Templates: placeholders like {audience} and {document} are the base of automation."],["Build a few-shot classifier (Billing, Technical, Feedback, Other) and test 15 messages","Flip one example label to wrong and measure the damage","Compare five word problems with and without step-by-step","Technical: wrap your classifier in a Python function and run 30 rows from a CSV"],"New classifier reaching 80% on 10 test items. When is chain-of-thought unnecessary?","DeepLearning.AI ChatGPT Prompt Engineering for Developers (Iterative lesson); promptingguide.ai (free guide covering zero-shot, few-shot, chain-of-thought and prompt chaining)"],
["Advanced Prompting","Diagnose failing prompts and iterate with controlled tests.",["Label failures with a taxonomy","Run A/B tests changing one variable","Write system prompts and defend against injection"],["Failures: ambiguity, missing context, conflicting rules, wrong format, too many tasks, capability limit, injected input.","One variable at a time, and version prompts as v1, v2, v3 with a change log.","System prompts set persistent role and rules; apps call this custom instructions or projects.","Long documents: put the document first, the question last, and ask for quotes before answers.","Prompt injection: text inside documents may try to override you. Treat outside text as data."],["Autopsy three bad prompts: name the failure, then fix it","A/B two prompt versions on five inputs with blind scoring","Write and test a system prompt for a writing assistant on 10 inputs","Plant hidden instructions in a document and harden your prompt"],"Given a failing prompt, name the failure and ship v2 with a change log. 10 quiz questions.","Anthropic and OpenAI prompt guides"],
["Evaluation & Hallucination","Verify output in proportion to the stakes and measure quality.",["Explain why hallucinations happen","Apply a verification ladder","Build an evaluation set and rubric"],["Models predict plausible text, not truth. Risk peaks for obscure facts, citations, numbers, legal and medical detail.","Ladder: sanity check, ask for uncertainty, second source, primary source, expert.","Grounding: answer only from supplied text, otherwise say \"not found\".","Open every AI citation. Fabricated references are common.","Eval set: 10-30 cases plus a 1-5 rubric, re-run after every change.","Watch for bias and sycophancy. Ask for counterarguments."],["Ask 15 obscure questions, verify them, compute your hallucination rate","Audit five AI-provided academic references","Grounded Q&A: 5 answerable and 5 unanswerable questions on a policy","Score two prompt versions on a 15-case eval set","Swap names in a reference-letter prompt and compare"],"Write a verification plan for a high-stakes task and present your eval results with a short interpretation.","Google AI Essentials (responsible use)"],
["AI for Daily Work","Save real time on writing, research, data and planning.",["Apply AI across common work domains","Calculate net time saved","Build a personal prompt library"],["Writing: supply your draft and style rules; ask for suggestions, not silent rewrites.","Research: use search-enabled tools, demand sources, verify key claims.","Spreadsheets: describe columns exactly, request formulas with explanations, test on a sample.","Meetings: turn notes into decisions, owners and due dates.","Savings = (time without AI - time with AI incl. review) x runs per month."],["Audit 20 monthly tasks and pick the top five for AI","Write 10 tested templates with variables","Time three tasks manually and with AI","Build an email-thread summarizer: summary, decisions, open questions, actions","Run a teach-then-quiz study session on a topic"],"Submit a time-savings table for five tasks with a keep-or-drop call for each.","Google AI Essentials (productivity module). Udemy: search for current, well-reviewed AI productivity courses and read the syllabus first; not verified here."],
["Structured Output","Get reliable JSON, tables and extractions from messy input.",["Define schemas and allowed values","Handle missing data safely","Validate output in code"],["Schema first: list fields, types, allowed values and an example.","Return nulls for missing data. Never let the model guess.","Normalize: ISO dates, currency codes, consistent units.","Validate: parse, check required fields and ranges, retry with the error message.","Multimodal: check numbers extracted from images against the source."],["Extract fields from 10 messy invoices and compute field accuracy","Turn a schedule paragraph into a table, then CSV","Test 3 inputs with missing fields for invented values","Extract data from a receipt photo and verify it","Technical: script parse, validate, retry once, write CSV"],"20 new documents at 90% field accuracy, or an error analysis explaining the misses.","Your provider documentation on structured output and function calling. Check the DeepLearning.AI short-course catalog for a current course on the topic; not verified here."],
["Workflows & Automation","Chain prompts into a workflow with human checkpoints.",["Decompose a process into steps","Place human review where it matters","Track cost, latency and failures"],["Patterns: sequential chain, routing, parallel and merge, generate and critique, human in the loop.","Map the manual process first. Automate one step at a time.","Guardrails: validate inputs and outputs, cap length, allow listed actions only, log runs.","Use small models for simple steps and large ones for hard reasoning.","No-code options: Zapier, Make, n8n or built-in office automations."],["Diagram one real workflow with inputs, outputs and risks","Run a three-step chain by hand and note where quality drops","Build a router that sends messages to one of three prompts","Add a critic step and re-score with your rubric","Automate one chain end to end and log cost per run"],"Show a working three-step workflow on 10 inputs with its process map, failure log and reliability estimate.","Automation tool documentation. Udemy: search for current AI automation courses and read the syllabus first; not verified here."],
["Agents, Tools & RAG","Understand tool use, retrieval and agent limits.",["Explain function calling","Explain RAG and when to use it","Assess risk before granting permissions"],["Tool use: the model requests a call; your code runs it and returns the result.","RAG: chunk, embed, store, retrieve similar chunks, answer from them. Quality depends on chunking and retrieval.","RAG for changing private knowledge, fine-tuning for style and format, long context for one-off documents.","Agents loop plan, act, observe. Errors compound and some actions cannot be undone.","Controls: least privilege, read-only by default, approvals, step limits, logs, sandboxes."],["Trace the steps behind a search-enabled answer and mark where to verify","Do manual RAG: paste only the right section for 8 questions","Write JSON schemas for get_weather and create_calendar_event and list failure modes","Risk-rate three agent tasks: permissions, worst case, controls","Technical: build a mini RAG demo and test on 10 questions"],"One-page design memo for an agent: tools, permissions, approvals and evaluation. Plus a quiz.","Check the DeepLearning.AI short-course catalog for a current course on agents or RAG (not verified here), and promptingguide.ai pages on RAG and function calling."],
["Ethics & Governance","Use AI responsibly, legally and safely.",["Spot privacy and confidentiality risks","Know disclosure and copyright norms","Write an AI use policy"],["Never paste passwords, client secrets, health records or personal identifiers into unapproved tools. Check retention and training settings.","Anonymize: swap names for placeholders, then restore.","Disclose AI use where schools, employers or publishers require it.","Audit outputs that affect people (hiring, grading, lending). A human stays accountable.","Know the frameworks: EU AI Act, NIST AI RMF, and your local data-protection law. Check current official sources."],["Sort 20 data items: safe, anonymize first, never paste","Anonymize an email, run an AI task, restore the details","Draft a one-page AI use policy","Analyze two public AI incidents and name the missing controls","Audit privacy settings in every AI tool you use"],"Submit your policy and pass a 15-question scenario quiz.","Google AI Essentials (responsible use module); Elements of AI chapter 6 (Implications)"],
["Capstone","Ship a documented, evaluated AI workflow for a task you really do.",["Design and build end to end","Prove it with an evaluation","Compare against your day-one baseline"],["Problem statement: task, user, current time cost, success criteria.","Process map with human checkpoints.","Prompt set with v1-v3 history and change logs.","At least one validated structured-output step.","Eval set of 20+ cases comparing two prompt versions.","Risk and ethics review, results report and a 5-minute demo."],["Write the problem statement and process map","Build and version the prompts","Create the 20-case evaluation and compare versions","Complete the risk review and ship the workflow","Redo the three baseline tasks and re-rate your skills"],"Self-grade against the rubric. Ideas: status-report generator, support triage, research digest, flashcard maker, expense extractor.","All course sources"]];

function nav(){const p=tot();$('#nav').innerHTML='<a href="#home" class="'+(loc()=='home'?'on':'')+'" style="--c:265"><span class="n">★</span>Overview · '+p+'%</a><div class="sep">Weeks</div>'+W.map((w,i)=>{const[x,y]=wp(i);return`<a href="#w${i+1}" style="--c:${hue(i)}" class="${loc()=='w'+(i+1)?'on ':''}${x==y?'done':''}"><span class="n">${x==y?'✓':i+1}</span>${w[0]}</a>`}).join('')+'<div class="sep">Resources</div><a href="#journal" style="--c:330" class="'+(loc()=='journal'?'on':'')+'"><span class="n">✎</span>Prompt journal</a><a href="#exam" style="--c:20" class="'+(loc()=='exam'?'on':'')+'"><span class="n">★</span>Final exam'+(S.exam!=null?' · '+S.exam+'%':'')+'</a><a href="#search" style="--c:200" class="'+(loc()=='search'?'on':'')+'"><span class="n">?</span>Search</a><a href="#glossary" style="--c:40" class="'+(loc()=='glossary'?'on':'')+'"><span class="n">Aa</span>Glossary</a><a href="#practice" style="--c:150" class="'+(loc()=='practice'?'on':'')+'"><span class="n">⬇</span>Practice files</a><a href="#toolkit" style="--c:190" class="'+(loc()=='toolkit'?'on':'')+'"><span class="n">⚙</span>Toolkit</a>'}
const loc=()=>location.hash.slice(1)||'home';
function home(){const p=tot();let next=W.findIndex((_,i)=>{const[x,y]=wp(i);return x<y});if(next<0)next=0;
$('#app').innerHTML=`<div class="hero"><div style="flex:1;min-width:260px"><h1>Learn to work with AI, not just chat with it.</h1><p>Twelve weeks of concepts, exercises and pass/fail checks, from how language models work to building your own automated workflows. Your progress saves in this browser.</p><a class="btn" href="#w${next+1}">${p?'Continue week '+(next+1):'Start week 1'}</a></div><div class="ring" style="--p:${p}"><b>${p}%</b></div></div>
${p==100?'<div class="card"><h3>Course complete</h3><p>You finished all 12 weeks. Repeat the baseline tasks and compare. <button class="btn g" onclick="print()">Print summary</button></p></div>':''}<div class="card"><h3>Before week 1: baseline (1 hour)</h3><p>Summarize a 1,000-word article into five bullets, draft a polite decline email, and extract names, dates and amounts from a messy paragraph into a table. Save every prompt and output. Rate yourself 1-5 on how AI works, prompting, verification, workflow design and ethics. You will repeat this in week 12.</p></div>
<div class="card"><h3>How each week works</h3><p>Learn (2 h), practice (3 h), apply to real work (1-2 h), then take the progress check (1 h). Score 80% or more to pass. Each week has a core track with no coding and a technical track for scripts and APIs.</p></div>
<div class="grid">${W.map((w,i)=>{const[x,y]=wp(i);return`<a class="tile" style="--c:${hue(i)}" href="#w${i+1}"><small>Week ${i+1}</small><h3>${w[0]}</h3><div class="bar"><i style="width:${x/y*100}%"></i></div></a>`}).join('')}</div>`;document.documentElement.style.setProperty('--h',265)}
function lesson(i){const l=typeof L!=='undefined'&&L[i];if(!l)return'<div class="card"><h3>In-depth lesson</h3><p style="color:var(--mu)">The full lesson for this week is not written yet. Use the concepts below and the aligned coursework for now.</p></div>';
return`${typeof CH!=='undefined'&&CH[i]?chap(i):`<div class="card"><h3>Lesson</h3>${l.p.map(t=>'<p style="margin-bottom:12px">'+esc(t)+'</p>').join('')}</div><div class="card"><h3>Worked example: ${esc(l.ex[0])}</h3><pre>${esc(l.ex[1])}</pre></div>`}<div class="card"><h3>Common mistakes</h3><ul>${l.m.map(t=>'<li>'+esc(t)+'</li>').join('')}</ul></div><div class="card"><h3>Key terms</h3><table>${l.t.map(t=>'<tr><td><b>'+esc(t[0])+'</b></td><td>'+esc(t[1])+'</td></tr>').join('')}</table></div><div class="card"><h3>Study plan</h3><ul>${l.s.map(t=>'<li>'+esc(t)+'</li>').join('')}</ul></div>${check(i)}${deep(i)}`}
function fig(t){const[k,c]=t.slice(8).split('|');return typeof DG!=='undefined'&&DG[k]?'<figure class="dg">'+DG[k](c)+'<figcaption>'+esc(c)+'</figcaption></figure>':''}
function chap(i){const c=CH[i];return c.s.map(s=>'<div class="card"><h3>'+esc(s[0])+'</h3>'+s[1].map(t=>t.startsWith('DIAGRAM:')?fig(t):t.startsWith('CODE:')?'<pre>'+esc(t.slice(5))+'</pre>':'<p style="margin-bottom:12px">'+esc(t)+'</p>').join('')+'</div>').join('')}
function check(i){const l=typeof L!=='undefined'&&L[i];if(!l||!l.k)return'';return`<div class="card"><h3>Check your understanding</h3><ul>${l.k.map(t=>'<li>'+esc(t)+'</li>').join('')}</ul><p style="color:var(--mu)">Answer in your own words before moving on. If you get stuck, reread the lesson.</p></div>`}
function deep(i){const d=typeof D!=='undefined'&&D[i];if(!d)return'';return`<div class="card" style="border-color:var(--ac)"><h3>Deep dive: ${esc(d[0])}</h3>${d[1].split('\n\n').map(t=>'<p style="margin-bottom:12px">'+esc(t)+'</p>').join('')}<p style="color:var(--ac2)"><b>Try it:</b> ${esc(d[2])}</p></div>`}
function week(i){const w=W[i],[x,y]=wp(i);document.documentElement.style.setProperty('--h',hue(i));
const ul=a=>'<ul>'+a.map(t=>{const k=t.indexOf(': ');return'<li>'+(k>0&&k<30?'<b>'+esc(t.slice(0,k))+':</b> '+esc(t.slice(k+2)):esc(t))+'</li>'}).join('')+'</ul>';
let body;
if(tab=='learn')body=`<div class="card"><h3>You will be able to</h3>${ul(w[2])}</div>${lesson(i)}<div class="card"><h3>Core concepts at a glance</h3>${ul(w[3])}</div><div class="card"><h3>Aligned coursework</h3><p>${esc(w[6])}</p></div>`;
else if(tab=='chapter')body=chap(i);
else if(tab=='practice')body=`<div class="card"><h3>Exercises · ${W[i][4].filter((_,k)=>S.ex[i+'-'+k]).length}/${w[4].length} done</h3>${w[4].map((e,k)=>`<label class="ex"><input type="checkbox" data-k="${k}" ${S.ex[i+'-'+k]?'checked':''}><span>${esc(e)}</span></label>`).join('')}</div>`;
else{const s=S.ck[i];body=`<div class="card"><h3>Practical check</h3><p>${esc(w[5])}</p></div><div class="card"><h3>Quiz</h3>${Q[i].map((q,k)=>{const o=[q[2],q[3]];o.splice(Math.floor(Math.random()*3),0,q[1]);return`<fieldset class="q"><legend>${k+1}. ${esc(q[0])}</legend>${o.map(t=>`<label class="ex"><input type="radio" name="q${k}" value="${esc(t)}"><span>${esc(t)}</span></label>`).join('')}</fieldset>`}).join('')}<div class="chk"><button class="btn g" id="sv">Grade quiz</button><span id="res">${s==null?'':`<span class="tag ${s>=80?'ok':'no'}">Last score ${s}%${s>=80?' · passed':' · below 80%, review and retry'}</span>`}</span></div></div>`}
$('#app').innerHTML=`<div class="wh"><div class="big">${String(i+1).padStart(2,'0')}</div><h2>${w[0]}</h2><p>${w[1]}</p><div class="bar" style="margin-top:16px;--c:${hue(i)}"><i style="width:${x/y*100}%;background:var(--ac)"></i></div></div>
<div class="tabs" role="tablist">${['learn','practice','check'].map(t=>`<button class="${tab==t?'on':''}" data-t="${t}">${{learn:'Learn',chapter:'Full chapter',practice:'Practice',check:'Progress check'}[t]}</button>`).join('')}</div>${body}
<div class="nx">${i>0?`<a class="btn g" href="#w${i}">Week ${i}</a>`:'<span></span>'}${i<11?`<a class="btn g" href="#w${i+2}">Week ${i+2}</a>`:''}</div>`;
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;week(i)});
document.querySelectorAll('.ex input').forEach(c=>c.onchange=()=>{S.ex[i+'-'+c.dataset.k]=c.checked;save();week(i);nav()});
const sv=$('#sv');if(sv)sv.onclick=()=>{let c=0,m=[];Q[i].forEach((q,k)=>{const r=document.querySelector(`input[name=q${k}]:checked`);if(r&&r.value==q[1])c++;else m.push((k+1)+': '+q[1]+(q[4]?' ('+q[4]+')':''))});const v=Math.round(c/Q[i].length*100);S.ck[i]=v;save();nav();$('#res').innerHTML=`<span class="tag ${v>=80?'ok':'no'}">${c}/${Q[i].length} · ${v>=80?'Passed':'Below 80%'}</span>`+(m.length?`<p style="flex-basis:100%;color:var(--mu)">Correct answers: ${esc(m.join(' | '))}</p>`:'')}}
function toolkit(){document.documentElement.style.setProperty('--h',190);$('#app').innerHTML=`<div class="wh"><h2>Toolkit</h2><p>The rubric for scoring prompts and four templates to copy into your own library.</p></div><div class="card"><h3>Prompt rubric (score each 1-5)</h3><div class="sc"><table><tr><th>Criterion</th><th>A 5 looks like</th></tr>${RUB.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div><p style="margin-top:10px;color:var(--mu)">32-40 professional · 24-31 solid · 16-23 revise · under 16 restart with TCFO</p></div>${TPL.map((t,k)=>`<div class="card"><h3>${t[0]}</h3><pre>${esc(t[1])}</pre><button class="btn g" data-c="${k}">Copy template</button></div>`).join('')}<div class="card"><h3>Finding the settings that matter</h3><p style="margin-bottom:10px">Menus and names change often and differ by product, so this is a checklist of what to look for, not a screen-by-screen guide. Check each tool you use, and write down the date.</p><ul><li>Open the account or settings menu and look for words like Privacy, Data controls, History, Personalization, Memory, Connectors or Integrations, Sharing and Delete.</li><li>Find out: is my content used to improve models, and can I turn that off? How long is history kept? How do I delete a chat or all history? What does memory store, and can I view and edit it?</li><li>List every connected app or tool, what each can access, and remove the ones you do not use.</li><li>If you cannot find something, search the product's help center for phrases such as 'delete chat history', 'use my data for training', 'memory' and 'connected apps'.</li><li>Work and school accounts may have different rules from personal ones. Ask your administrator if unsure.</li><li>Screenshot or note what you find and the date, and repeat every few months.</li></ul></div><div class="card"><h3>Your data</h3><p style="margin-bottom:12px">Progress lives in this browser only. Export it to move devices or keep a backup.</p><button class="btn g" id="ex">Export progress</button> <label class="btn g" style="cursor:pointer">Import<input type="file" id="im" accept=".json" hidden></label> <button class="btn g" id="rs">Clear my progress</button></div>`;
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(TPL[b.dataset.c][1]).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy template',1500)}).catch(()=>{})});
$('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='ai-literacy-progress.json';a.click()};
$('#im').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(d&&d.ex&&d.ck){S=d;save();nav();toolkit()}else alert('That file is not a progress export.')}catch(x){alert('Could not read that file.')}})};
$('#rs').onclick=()=>{if(confirm('Clear all saved progress?')){S={ex:{},ck:{}};save();nav();toolkit()}}}
function journal(){document.documentElement.style.setProperty('--h',330);const J=S.jr||[];$('#app').innerHTML=`<div class="wh"><h2>Prompt journal</h2><p>Log each prompt version with a 1-5 result score so you can see what changed.</p></div><div class="card"><h3>New entry</h3><input id="jt" class="in" placeholder="Task"><textarea id="jp" rows="4" class="in" placeholder="Prompt, with version (for example v2)"></textarea><div class="chk"><label>Result 1-5</label><input type="number" id="js" min="1" max="5" value="3"><button class="btn g" id="ja">Add entry</button></div></div>${J.length?J.map((e,k)=>`<div class="card"><h3>${esc(e.t)} · ${e.s}/5</h3><small style="color:var(--mu)">${e.d}</small><pre>${esc(e.p)}</pre><button class="btn g" data-x="${k}">Delete</button></div>`).join(''):'<p style="color:var(--mu)">No entries yet. Add your first prompt above.</p>'}`;
$('#ja').onclick=()=>{const t=$('#jt').value.trim(),p=$('#jp').value.trim();if(!t||!p)return;(S.jr=S.jr||[]).unshift({t,p,s:Math.min(5,Math.max(1,+$('#js').value||3)),d:new Date().toLocaleDateString()});save();journal()};
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{S.jr.splice(b.dataset.x,1);save();journal()})}
const PF=[["Week 2","scripts/01_token_usage.py","Token counts and temperature variance"],["Week 3","scripts/06_capture_outputs.py","Capture real outputs from your own runs"],["Week 3","data/sample_prompts.json","Four prompts to capture"],["Week 4","scripts/02_classify.py","Few-shot classifier with accuracy"],["Week 4","data/messages.csv","30 labeled messages, 10 edge cases"],["Week 6","data/hallucination_questions.md","15-question hallucination hunt"],["Week 6","scripts/04_grounded_qa.py","Grounded Q&A scorer"],["Week 6","data/policy.txt","Fictional policy document"],["Week 6","data/policy_questions.json","5 answerable, 5 unanswerable questions"],["Week 8","scripts/03_extract.py","Extraction, validation, retry"],["Week 8","data/invoices.txt","10 messy invoices"],["Week 8","data/invoices_key.json","Answer key"],["Week 10","scripts/05_mini_rag.py","Mini RAG demo"],["Setup","README.md","API key setup and safety"],["Setup","scripts/common.py","Shared API helper (set the model here)"]];
function practice(){document.documentElement.style.setProperty('--h',150);$('#app').innerHTML=`<div class="wh"><h2>Practice files</h2><p>Sample data and starter scripts for the exercises. Keep the practice folder next to this page when you deploy. Read the README before running anything: scripts use your API key and cost a little per run.</p><a class="btn g" href="practice-files.zip" style="margin-top:14px;display:inline-block">Download all (zip)</a></div><div class="card"><div class="sc"><table><tr><th>When</th><th>File</th><th>What it is</th></tr>${PF.map(f=>`<tr><td>${f[0]}</td><td><a href="practice/${f[1]}" target="_blank" rel="noopener">${f[1]}</a></td><td>${f[2]}</td></tr>`).join('')}</table></div></div>`}
function glossary(){document.documentElement.style.setProperty('--h',40);const m={};Object.keys(L).forEach(k=>L[k].t.forEach(t=>{if(!m[t[0]])m[t[0]]=[t[1],+k+1]}));const T=Object.keys(m).sort((a,b)=>a.localeCompare(b));
const draw=q=>T.filter(t=>(t+m[t][0]).toLowerCase().includes(q.toLowerCase())).map(t=>`<tr><td><b>${esc(t)}</b></td><td>${esc(m[t][0])}</td><td><a href="#w${m[t][1]}">Week ${m[t][1]}</a></td></tr>`).join('')||'<tr><td colspan="3">No matches.</td></tr>';
$('#app').innerHTML=`<div class="wh"><h2>Glossary</h2><p>${T.length} terms from across the course.</p></div><div class="card"><input id="gq" class="in" placeholder="Search terms" aria-label="Search glossary"><div class="sc"><table><tr><th>Term</th><th>Meaning</th><th>Where</th></tr><tbody id="gb">${draw('')}</tbody></table></div></div>`;
$('#gq').oninput=e=>{$('#gb').innerHTML=draw(e.target.value)}}
function searchPage(){document.documentElement.style.setProperty('--h',200);const idx=[];
if(typeof CH!=='undefined')Object.keys(CH).forEach(k=>CH[k].s.forEach(s=>idx.push({t:s[0],w:+k+1,x:s[1].map(p=>p.replace(/^(CODE:|DIAGRAM:)/,'')).join(' ')})));
Object.keys(L).forEach(k=>L[k].t.forEach(t=>idx.push({t:t[0]+' (term)',w:+k+1,x:t[1]})));
$('#app').innerHTML='<div class="wh"><h2>Search</h2><p>Search every chapter and key term.</p></div><div class="card"><input id="sq" class="in" placeholder="Search the course" aria-label="Search the course"><div id="sr" aria-live="polite"></div></div>';
const go=q=>{const ws=q.toLowerCase().split(/\s+/).filter(Boolean);if(!ws.length){$('#sr').innerHTML='';return}
const r=idx.filter(e=>{const s=(e.t+' '+e.x).toLowerCase();return ws.every(w=>s.includes(w))}).slice(0,30);
$('#sr').innerHTML=r.length?r.map(e=>{const s=e.x,i=Math.max(0,s.toLowerCase().indexOf(ws[0])),sn=s.slice(Math.max(0,i-60),i+110);return'<p style="margin:12px 0"><a href="#w'+e.w+'"><b>'+esc(e.t)+'</b></a> <small style="color:var(--mu)">Week '+e.w+'</small><br><span style="color:var(--mu)">...'+esc(sn)+'...</span></p>'}).join(''):'<p>No matches.</p>'};
$('#sq').oninput=e=>go(e.target.value)}
function exam(){document.documentElement.style.setProperty('--h',20);
const pool=[];Q.forEach((w,k)=>w.forEach((q,j)=>pool.push({k,q,sc:j==w.length-1})));
const E=[...pool.filter(x=>x.sc),...pool.filter(x=>!x.sc).sort(()=>Math.random()-.5).slice(0,18)].sort(()=>Math.random()-.5);
const best=S.exam;
$('#app').innerHTML='<div class="wh"><h2>Final exam</h2><p>30 questions from all 12 weeks, including one scenario question from every week. Pass mark 80% (24 of 30). Reload this page for a fresh set. Your best score is saved in this browser.'+(best!=null?' Best so far: '+best+'%.':'')+'</p></div><div class="card">'+E.map((x,n)=>{const o=[x.q[2],x.q[3]];o.splice(Math.floor(Math.random()*3),0,x.q[1]);return'<fieldset class="q"><legend>'+(n+1)+'. '+esc(x.q[0])+'</legend>'+o.map(t=>'<label class="ex"><input type="radio" name="e'+n+'" value="'+esc(t)+'"><span>'+esc(t)+'</span></label>').join('')+'</fieldset>'}).join('')+'<div class="chk"><button class="btn g" id="eg">Grade exam</button><span id="er" aria-live="polite"></span></div></div>';
$('#eg').onclick=()=>{let c=0;const miss=[],wk={};E.forEach((x,n)=>{const r=document.querySelector('input[name=e'+n+']:checked');if(r&&r.value==x.q[1])c++;else{miss.push((n+1)+'. '+x.q[1]+(x.q[4]?' ('+x.q[4]+')':''));wk[x.k+1]=1}});
const v=Math.round(c/E.length*100);if(S.exam==null||v>S.exam)S.exam=v;save();
$('#er').innerHTML='<span class="tag '+(v>=80?'ok':'no')+'">'+c+'/'+E.length+' · '+v+'% · '+(v>=80?'Passed':'Below 80%')+'</span>'+(miss.length?'<p style="flex-basis:100%;color:var(--mu)">Review weeks: '+Object.keys(wk).map(w=>'<a href="#w'+w+'">'+w+'</a>').join(', ')+'</p><ul style="flex-basis:100%">'+miss.map(m=>'<li>'+esc(m)+'</li>').join('')+'</ul>':'');nav()}}

function route(){const l=loc();side.classList.remove('open');nav();document.querySelectorAll('#nav a.on').forEach(a=>a.setAttribute('aria-current','page'));const m=l.match(/^w(\d+)$/);if(m&&W[m[1]-1]){tab='learn';week(m[1]-1)}else if(l=='journal')journal();else if(l=='practice')practice();else if(l=='glossary')glossary();else if(l=='search')searchPage();else if(l=='exam')exam();else if(l=='toolkit')toolkit();else home();scrollTo(0,0)}
addEventListener('hashchange',route);route();
</script>
</body>
